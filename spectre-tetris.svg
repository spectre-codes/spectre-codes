<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title description">
<title id="title">SPECTRE CODES: animated falling blocks</title>
<desc id="description">Dark gradient developer header with neon Tetris-inspired pieces dropping into a grid beside the words SPECTRE CODES.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#080e1d"/><stop offset="50%" stop-color="#111a33"/><stop offset="100%" stop-color="#071c2c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8d7eff"/><stop offset="100%" stop-color="#41d8d4"/></linearGradient>
  <radialGradient id="aura"><stop offset="0" stop-color="#6b67df" stop-opacity="0.21"/><stop offset="1" stop-color="#6b67df" stop-opacity="0"/></radialGradient>
  <pattern id="microgrid" width="29" height="29" patternUnits="userSpaceOnUse"><path d="M29 0H0V29" fill="none" stroke="#7791af" stroke-opacity="0.095" stroke-width="1"/></pattern>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .p1 { animation: drop1 14s cubic-bezier(.24,.8,.28,1) infinite; }
  .p2 { animation: drop2 14s cubic-bezier(.24,.8,.28,1) infinite; }
  .p3 { animation: drop3 14s cubic-bezier(.24,.8,.28,1) infinite; }
  .p4 { animation: drop4 14s cubic-bezier(.24,.8,.28,1) infinite; }
  .cursor { animation: blink 1.1s steps(1,end) infinite; }
  .signal { animation: breathe 3s ease-in-out infinite; }
  .scan { animation: glide 14s linear infinite; }
  @keyframes drop1 { 0%,2% {transform:translateY(-208px);opacity:0} 4%{opacity:1} 18%,91%{transform:translateY(0);opacity:1} 98%,100%{transform:translateY(0);opacity:0} }
  @keyframes drop2 { 0%,20% {transform:translateY(-204px);opacity:0} 22%{opacity:1} 35%,91%{transform:translateY(0);opacity:1} 98%,100%{transform:translateY(0);opacity:0} }
  @keyframes drop3 { 0%,38% {transform:translateY(-200px);opacity:0} 40%{opacity:1} 53%,91%{transform:translateY(0);opacity:1} 98%,100%{transform:translateY(0);opacity:0} }
  @keyframes drop4 { 0%,56% {transform:translateY(-196px);opacity:0} 58%{opacity:1} 71%,91%{transform:translateY(0);opacity:1} 98%,100%{transform:translateY(0);opacity:0} }
  @keyframes blink { 0%,48% {opacity:1} 49%,100% {opacity:0} }
  @keyframes breathe { 0%,100% {opacity:.4} 50% {opacity:1} }
  @keyframes glide { 0% {transform:translateX(-900px);opacity:0} 8% {opacity:.35} 60%,100% {transform:translateX(0);opacity:0} }
  @media (prefers-reduced-motion:reduce) { .p1,.p2,.p3,.p4,.cursor,.signal,.scan{animation:none!important;opacity:1!important;transform:none!important} }
</style>
